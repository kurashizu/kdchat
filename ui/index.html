<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#101218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VRChat Chatbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true">🍳</span><b data-i18n="brand"></b></div>
    <div class="outputs" role="group" data-i18n-aria="outputs.aria">
      <button type="button" data-mode="chatbox" data-i18n-title="out.title" aria-pressed="false">
        <span class="ico" aria-hidden="true">🎮</span><span class="lbl" data-i18n="out.chatbox"></span><i class="led" aria-hidden="true"></i></button>
      <button type="button" data-mode="kd" data-i18n-title="out.title" aria-pressed="false">
        <span class="ico" aria-hidden="true">🖥</span><span class="lbl" data-i18n="out.kd"></span><i class="led" aria-hidden="true"></i></button>
    </div>
    <div class="conn" id="conn" role="status" data-i18n-title="conn.title"><i></i><span data-i18n="conn.connecting"></span></div>
    <button type="button" class="icon-btn lang" id="langBtn" data-i18n-title="lang.switchTitle" data-i18n-aria="lang.switchTitle"></button>
    <button type="button" class="icon-btn" id="openSettings" data-i18n-title="settings.open" data-i18n-aria="settings.open"
            aria-haspopup="dialog" aria-controls="sheet"><span aria-hidden="true">⚙︎</span></button>
  </header>
  <div class="offline" id="offline" role="alert" hidden data-i18n="conn.banner"></div>

  <main class="grid" id="grid">
    <section class="col">
      <div class="card composer" id="composer">
        <div class="editing" id="editing" hidden>
          <span class="what"><span data-i18n="composer.editing"></span> <b id="editWhat"></b></span>
          <button type="button" class="btn sm ghost" id="editCancel" data-i18n="composer.cancel"></button>
        </div>
        <div class="input-row">
          <textarea id="text" rows="1" enterkeyhint="send" autocomplete="off" data-i18n-aria="composer.aria"></textarea>
          <button type="button" class="btn primary send" id="send">
            <span class="ico" aria-hidden="true">➤</span><span class="lbl" id="sendLbl"></span></button>
        </div>
        <div class="tools">
          <div class="targets" id="targets" role="group" data-i18n-aria="to.aria">
            <button type="button" data-to="chatbox" data-i18n-aria="to.chatbox" aria-pressed="true"><span aria-hidden="true">🎮</span></button>
            <button type="button" data-to="kd" data-i18n-aria="to.kd" aria-pressed="true"><span aria-hidden="true">🖥</span></button>
          </div>
          <button type="button" class="pill" id="tLive" data-i18n-title="opt.liveDesc" aria-pressed="false">
            <i class="dot" aria-hidden="true"></i><span data-i18n="opt.liveShort"></span></button>
          <button type="button" class="btn sm ghost" id="kbFill" data-i18n-title="kbFill.title" data-i18n-aria="kbFill.title">
            <span aria-hidden="true">⌨️</span><span class="lbl" data-i18n="kbFill"></span></button>
          <span class="status" id="status" aria-live="polite"></span>
          <span class="count" id="count"></span>
          <button type="button" class="btn sm ghost" id="cancel" hidden data-i18n-title="composer.cancelTitle">
            <span aria-hidden="true">✕</span><span class="lbl" data-i18n="composer.cancel"></span></button>
        </div>
      </div>

      <section class="card">
        <h2 data-i18n="hist.title"></h2>
        <ul class="history" id="history"></ul>
      </section>
    </section>

    <section class="col" id="kdCol" hidden>
      <div class="card kd">
        <div class="device"><div class="label"><i></i>Klaude Display</div><img id="prev" data-i18n-alt="kd.previewAlt"><b id="led"></b></div>
        <div class="kdstat" id="kdStat">…</div>
        <div class="kd-actions">
          <button type="button" class="btn sm" id="chime"><span aria-hidden="true">🔔</span><span data-i18n="kd.chime"></span></button>
          <label class="btn sm" data-i18n-title="kd.imageTitle"><span aria-hidden="true">🖼</span><span data-i18n="kd.image"></span>
            <input type="file" id="file" accept="image/*" hidden></label>
          <button type="button" class="btn sm" id="closeImg" hidden><span aria-hidden="true">✕</span><span data-i18n="kd.closeImg"></span></button>
          <button type="button" class="btn sm ghost" id="kdClear" data-i18n-title="kd.clearTitle"><span data-i18n="kd.clear"></span></button>
        </div>
        <p class="hint desk-only" data-i18n="kd.hint"></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="/docs" target="_blank" rel="noopener">📖 <span data-i18n="hist.docs"></span></a>
    <span>POST /api/v1/messages · PUT /api/v1/typing · PUT /api/v1/outputs · /api/v1/kd/*</span>
  </footer>

  <!-- settings: a bottom sheet on phones, a side drawer on wide screens -->
  <div class="sheet" id="sheet" hidden>
    <div class="backdrop" id="sheetBackdrop"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="panel-head">
        <h2 id="sheetTitle" data-i18n="settings.title"></h2>
        <button type="button" class="icon-btn" id="closeSettings" data-i18n-aria="settings.close" data-i18n-title="settings.close">
          <span aria-hidden="true">✕</span></button>
      </div>
      <div class="panel-body">
        <section class="sec">
          <h3 data-i18n="lang.label"></h3>
          <div class="seg wide" id="langSeg">
            <button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="zh" lang="zh-CN">中文</button>
          </div>
        </section>
        <section class="sec">
          <h3 data-i18n="sec.sending"></h3>
          <button type="button" class="switch-row" id="sLive" role="switch" aria-checked="false">
            <span class="txt"><b data-i18n="opt.live"></b><small data-i18n="opt.liveDesc"></small></span><i class="sw" aria-hidden="true"></i></button>
          <button type="button" class="switch-row" id="sTyping" role="switch" aria-checked="false">
            <span class="txt"><b data-i18n="opt.typing"></b><small data-i18n="opt.typingDesc"></small></span><i class="sw" aria-hidden="true"></i></button>
          <button type="button" class="switch-row" id="sSfx" role="switch" aria-checked="false">
            <span class="txt"><b data-i18n="opt.sfx"></b><small data-i18n="opt.sfxDesc"></small></span><i class="sw" aria-hidden="true"></i></button>
          <button type="button" class="switch-row" id="sEnter" role="switch" aria-checked="false">
            <span class="txt"><b data-i18n="opt.enter"></b><small data-i18n="opt.enterDesc"></small></span><i class="sw" aria-hidden="true"></i></button>
        </section>
        <section class="sec" id="kdSec">
          <h3 data-i18n="sec.kd"></h3>
          <p class="hint" id="kdOffHint" data-i18n="kd.offHint"></p>
          <div id="settings"></div>
        </section>
        <section class="sec">
          <h3 data-i18n="sec.more"></h3>
          <div class="row wrap">
            <button type="button" class="btn danger" id="clearHist" data-i18n="hist.clear"></button>
            <a class="btn" href="/docs" target="_blank" rel="noopener"><span aria-hidden="true">📖</span><span data-i18n="hist.docs"></span></a>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="dropzone" id="dropzone" data-i18n="kd.drop"></div>
  <script src="/ui/i18n.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
