name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (project env, locked)
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -q
      - name: "Console: the committed build (ui/) matches web/"
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: |
          npm ci
          npm run build
          git status --porcelain -- ../ui
          test -z "$(git status --porcelain -- ../ui)" || { echo "ui/ is out of date: cd web && npm run build, commit"; exit 1; }
