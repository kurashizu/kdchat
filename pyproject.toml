[project]
name = "kdchat"
version = "1.6.0"
description = "Send messages to the VRChat chatbox (OSC) from your phone or any browser: web console + REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mini-racer>=0.14",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "python-osc>=1.10.2",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
    "pywebview>=5 ; sys_platform == 'win32'",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
