[project]
name = "kdchat"
version = "1.8.4"
description = "Send messages to the VRChat chatbox (OSC) from your phone or any browser: web console + REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-osc>=1.10.2",
    "segno>=1.6.6",
    "uvicorn>=0.52.1",
    "wasmtime>=36",
]

[project.optional-dependencies]
# server-side picture decoding for API clients that send JPEG / PNG / ... (the console decodes in the browser and
# sends raw RGB, so the desktop build does without it)
images = ["pillow>=12.3.0"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
    "pywebview>=5 ; sys_platform == 'win32'",
]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
